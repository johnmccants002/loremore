name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:edge
      - run: npx --yes deno@2.9.6 check --config supabase/functions/analyze-moment/deno.json supabase/functions/analyze-moment/index.ts
      - run: npx expo install --check
      - run: npm run export
